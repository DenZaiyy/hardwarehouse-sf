# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.supported_locales: 'en|fr'

    # Identité du vendeur portée sur les factures. Valeurs fictives (projet d'examen), remplaçables par
    # les variables d'environnement du même nom ; vider INVOICE_NOTICE avec de vraies valeurs.
    app.invoice_seller:
        name: '%env(INVOICE_SELLER_NAME)%'
        address: '%env(INVOICE_SELLER_ADDRESS)%'
        siret: '%env(INVOICE_SELLER_SIRET)%'
        vat_number: '%env(INVOICE_SELLER_VAT_NUMBER)%'
        notice: '%env(INVOICE_NOTICE)%'
    env(INVOICE_SELLER_NAME): 'HardWareHouse SAS (société fictive)'
    env(INVOICE_SELLER_ADDRESS): '10 avenue de Bruxelles, 68350 Brunstatt-Didenheim, France'
    env(INVOICE_SELLER_SIRET): '000 000 000 00000 (fictif)'
    env(INVOICE_SELLER_VAT_NUMBER): 'FR00 000000000 (fictif)'
    env(INVOICE_NOTICE): "Document établi dans le cadre d'un projet d'examen : la société et ses identifiants sont fictifs."

    # Jeton partagé avec l'API du catalogue pour les sorties de stock (même valeur des deux côtés).
    # Vide par défaut : les sorties de stock échouent avec un message explicite tant qu'il n'est pas défini.
    env(SHOP_API_TOKEN): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Seul le client de l'API du catalogue est simulé : les autres (Iconify…) restent réels
        App\Tests\Http\ApiMockResponseFactory: ~

        api.client.mock:
            class: Symfony\Component\HttpClient\MockHttpClient
            decorates: api.client
            arguments: ['@App\Tests\Http\ApiMockResponseFactory', '%env(API_BASE_URL)%']
