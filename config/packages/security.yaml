security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        # used to reload user from session & other features (e.g. switch_user)

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build|webhook)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app.login
                check_path: app.login
                enable_csrf: true
            logout:
                path: app.logout
                # where to redirect after logout
                target: homepage

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds

            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied.
    # Routes below are prefixed by {_locale} (/fr/..., /en/...), so every path is
    # locale-agnostic (^/[a-z]{2}/...). This is a defense-in-depth net: the primary
    # enforcement for /admin lives on the controllers themselves via #[IsGranted]
    # (see App\Controller\Admin\AbstractSecuredCrudController), since a routing change
    # here alone was previously enough to make these rules match nothing at all.
    access_control:
        - { path: '^/[a-z]{2}/admin/user', roles: ROLE_SUPER_ADMIN }
        - { path: '^/[a-z]{2}/admin', roles: ROLE_ADMIN }
        - { path: '^/[a-z]{2}/profile', roles: ROLE_USER }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
