# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    http_client:
        scoped_clients:
            api.client:
                base_uri:  '%env(API_BASE_URL)%'
                # caching géré automatiquement si tu utilises HttpCache

    # Note that the session will be started ONLY if you read or write from it.
    # Values below match Symfony's own defaults, made explicit so a future Symfony
    # upgrade can't silently change them for a checkout/payment app.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    # Une ressource absente de l'API du catalogue (slug inconnu, fiche supprimée) est une page
    # introuvable pour le visiteur, pas une erreur serveur : produit, catégorie et marque.
    exceptions:
        App\Exception\Api\ApiNotFoundException:
            status_code: 404
            log_level: notice

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
