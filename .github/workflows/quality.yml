name: Quality Analysis
on:
    workflow_call:
jobs:
    quality:
        name: Quality Analysis
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: 8.4
                  tools: composer:v2

            - name: Cache Composer dependencies
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: /tmp/composer-cache
                  key: ${{ runner.os }}-composer-quality-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-quality-
                      ${{ runner.os }}-composer-

            - name: Update composer
              run: composer self-update

            - name: Install dependencies
              run: |
                  composer config cache-dir /tmp/composer-cache
                  composer install --no-interaction --no-progress --optimize-autoloader

            - name: Quality Analysis
              run: |
                  # Créer dossiers pour rapports
                  mkdir -p /tmp/quality-reports

                  # Variables pour tracking des erreurs
                  ERRORS=0

                  # Exécuter ECS avec rapport (continue si échec)
                  echo "🔍 Running ECS..." | tee -a /tmp/quality-reports/quality-output.log
                  if ! php ./vendor/bin/ecs check --fix --output-format=json > /tmp/quality-reports/ecs-report.json 2>&1; then
                      echo "❌ ECS failed" | tee -a /tmp/quality-reports/quality-output.log
                      ERRORS=$((ERRORS + 1))
                  fi

                  # Exécuter Rector avec rapport (continue si échec)
                  echo "🔧 Running Rector..." | tee -a /tmp/quality-reports/quality-output.log
                  if ! php ./vendor/bin/rector --dry-run --output-format=json > /tmp/quality-reports/rector-report.json 2>&1; then
                      echo "❌ Rector failed" | tee -a /tmp/quality-reports/quality-output.log
                      ERRORS=$((ERRORS + 1))
                  fi

                  # Lint YAML (continue si échec)
                  echo "📝 Linting YAML..." | tee -a /tmp/quality-reports/quality-output.log
                  if ! php bin/console lint:yaml config --parse-tags 2>&1 | tee -a /tmp/quality-reports/yaml-lint.log; then
                      echo "❌ YAML lint failed" | tee -a /tmp/quality-reports/quality-output.log
                      ERRORS=$((ERRORS + 1))
                  fi

                  # Lint Twig (continue si échec)
                  echo "🎨 Linting Twig..." | tee -a /tmp/quality-reports/quality-output.log
                  if ! php bin/console lint:twig templates 2>&1 | tee -a /tmp/quality-reports/twig-lint.log; then
                      echo "❌ Twig lint failed" | tee -a /tmp/quality-reports/quality-output.log
                      ERRORS=$((ERRORS + 1))
                  fi

                  # Lint Container (continue si échec)
                  echo "🏗️ Linting Container..." | tee -a /tmp/quality-reports/quality-output.log
                  if ! php bin/console lint:container 2>&1 | tee -a /tmp/quality-reports/container-lint.log; then
                      echo "❌ Container lint failed" | tee -a /tmp/quality-reports/quality-output.log
                      ERRORS=$((ERRORS + 1))
                  fi

                  # PHPStan avec rapport JSON (continue si échec)
                  echo "🧪 Running PHPStan..." | tee -a /tmp/quality-reports/quality-output.log
                  if ! php ./vendor/bin/phpstan analyse --memory-limit=-1 --level max --error-format=json > /tmp/quality-reports/phpstan-report.json 2>&1; then
                      echo "❌ PHPStan failed" | tee -a /tmp/quality-reports/quality-output.log
                      ERRORS=$((ERRORS + 1))
                  fi

                  # Rapport final avec codes de sortie
                  echo "Total errors found: $ERRORS" | tee -a /tmp/quality-reports/quality-output.log

                  if [ $ERRORS -gt 0 ]; then
                      echo "❌ Quality analysis completed with $ERRORS error(s)" | tee -a /tmp/quality-reports/quality-output.log
                      exit 1
                  else
                      echo "✅ Quality analysis completed successfully" | tee -a /tmp/quality-reports/quality-output.log
                  fi

            - name: Upload quality reports
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: always()
              with:
                  name: quality-reports-${{ github.run_number }}
                  path: |
                      /tmp/quality-reports/
                  retention-days: 30

            - name: Upload PHPStan cache (for analysis)
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: always()
              with:
                  name: phpstan-cache-${{ github.run_number }}
                  path: |
                      var/cache/phpstan/
                      .phpstan.cache
                  retention-days: 7
