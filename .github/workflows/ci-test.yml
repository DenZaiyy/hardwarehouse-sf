name: CI Test Pipeline
on:
    push:
        branches:
            - test

permissions:
    contents: write
    pull-requests: write

jobs:
    # Re-teste tout sur test pour sécurité
    audit:
        uses: ./.github/workflows/audit.yml

    quality:
        uses: ./.github/workflows/quality.yml

    tests:
        uses: ./.github/workflows/test.yml

    # Déploie la branche test sur la préproduction (test.hardwarehouse.fr).
    # Sauté tant que la variable de dépôt PREPROD_ENABLED ne vaut pas 'true' : le serveur n'est pas installé.
    deploy-test:
        name: Deploy to preprod
        needs: [audit, quality, tests]
        if: vars.PREPROD_ENABLED == 'true'
        runs-on: ubuntu-latest
        environment: preprod
        timeout-minutes: 15
        concurrency:
            group: preprod-deployment
            cancel-in-progress: false
        steps:
            - name: Deploy to preprod server
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  port: ${{ secrets.PORT }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  timeout: 300s
                  script_stop: true
                  script: |
                      set -e
                      echo "🚀 Starting preprod deployment..."

                      # Secret distinct de PROJECT_PATH : un oubli de configuration ne doit jamais
                      # déployer la branche test dans le dossier de production.
                      PROJECT_PATH="${{ secrets.PREPROD_PROJECT_PATH }}"
                      PROD_PATH="${{ secrets.PROJECT_PATH }}"
                      if [ -z "$PROJECT_PATH" ] || [ "$PROJECT_PATH" = "$PROD_PATH" ]; then
                          echo "❌ PREPROD_PROJECT_PATH manquant ou identique au chemin de production"
                          exit 1
                      fi

                      cd "$PROJECT_PATH"

                      echo "🔧 Enabling maintenance mode..."
                      touch var/maintenance.flag || true

                      echo "📥 Fetching latest code..."
                      git fetch origin --prune
                      git reset --hard origin/test

                      echo "📦 Running production build..."
                      make prod

                      echo "✅ Disabling maintenance mode..."
                      rm -f var/maintenance.flag || true

                      echo "🩺 Running health check..."
                      php bin/console about --env=prod > /dev/null

                      echo "🎉 Preprod deployment completed successfully!"

    # Crée la PR vers main quand les tests passent et que la préproduction est à jour, ou sautée.
    # Un job sauté fait sauter ceux qui en dépendent : d'où la condition explicite.
    create-pr-to-master:
        name: Create PR to Master
        needs: [audit, quality, tests, deploy-test]
        if: >-
            !cancelled()
            && needs.audit.result == 'success'
            && needs.quality.result == 'success'
            && needs.tests.result == 'success'
            && (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped')
        runs-on: ubuntu-latest
        steps:
            # Une PR suit sa branche : GitHub y ajoute de lui-même les commits arrivés sur test. Il ne reste qu'à
            # la créer si aucune n'est ouverte, sinon à refaire son corps, qui décrit l'état de la préproduction.
            # PAT_TOKEN plutôt que GITHUB_TOKEN : une PR créée avec ce dernier ne déclenche pas les workflows.
            - name: Create or update the pull request from test to main
              env:
                  GH_TOKEN: ${{ secrets.PAT_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  PREPROD: ${{ needs.deploy-test.result == 'success' && '✅ **Préproduction :** à jour sur [test.hardwarehouse.fr](https://test.hardwarehouse.fr)' || '⏭️ **Préproduction :** sautée, non configurée (variable `PREPROD_ENABLED`)' }}
              run: |
                  if [ "$(gh api "repos/$GH_REPO/compare/main...test" --jq '.ahead_by')" = "0" ]; then
                      echo "test n'a aucun commit absent de main : pas de PR"
                      exit 0
                  fi

                  BODY=$(printf '## 🚀 Déploiement en Production\n\n✅ **Tests passés sur :** dev → test\n%s\n' "$PREPROD")
                  PR=$(gh pr list --base main --head test --state open --json number --jq '.[].number')

                  if [ -n "$PR" ]; then
                      gh pr edit "$PR" --body "$BODY"
                      echo "PR #$PR mise à jour"
                  else
                      gh pr create --base main --head test --title "🚀 Deploy to Production - Auto PR from test" --body "$BODY"
                  fi
